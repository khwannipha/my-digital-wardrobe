<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตู้เสื้อผ้าดิจิทัลของฉัน</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@300;400;500&family=Noto+Sans+Thai:wght@300;400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f5efe4;--card:#fbf7ef;--ink:#4b3d31;--mut:#8f7d6b;--line:#e4d9c6;--acc:#9c7b5c;--acc2:#6f543d;--sand:#ebe1cf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:300 15px/1.7 "Gothic A1","Noto Sans Thai","Helvetica Neue",Arial,sans-serif;letter-spacing:.01em}
h1,h2,h3,h4{font-weight:400;margin:0}h3{margin:28px 0 12px;font-size:18px}h4{margin:14px 0 8px;color:var(--mut);font-size:14px}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
#sb{position:sticky;top:0;height:100vh;overflow:auto;padding:26px 16px;border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:18px}
.brand{font-size:19px;letter-spacing:.06em}
.sn{display:flex;flex-direction:column;gap:4px}
.sn button,#bn button{background:none;border:0;padding:10px 14px;border-radius:12px;cursor:pointer;color:var(--mut);text-align:left;min-height:44px}
.sn button.on,#bn button.on{background:var(--sand);color:var(--ink)}
.th{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:13px;margin-bottom:6px}
.lk{background:none;border:0;color:var(--acc2);cursor:pointer;font-size:13px;padding:6px}
.ti{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:none;border:0;border-radius:10px;padding:9px 12px;cursor:pointer;text-align:left;min-height:40px}
.ti:hover{background:var(--sand)}.ti.on{background:var(--ink);color:#fbf7ef}.ti em{font-style:normal;font-size:12px;opacity:.65}
.tr2{display:flex;align-items:center}.tr2 .ti{flex:1}
.car{width:28px;height:40px;border:0;background:none;cursor:pointer;color:var(--mut);flex:none}
.ti.sub{width:calc(100% - 28px);margin-left:28px;color:var(--mut)}.ti.sub.on{color:#fbf7ef}
.who{margin-top:auto;font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:8px;word-break:break-all}
.col{min-width:0}.top,#bn,#scrim{display:none}
main{max-width:1180px;margin:0 auto;padding:32px 28px 100px}
.chip{flex:none;white-space:nowrap}.t1{display:none}
.mr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border-radius:10px}
.mr.p{background:var(--sand);margin-top:12px}.mr:not(.p){margin-left:18px;border-bottom:1px solid var(--line)}
.mr b,.mr .nm{flex:1;min-width:110px;font-weight:400}.mr small{color:var(--mut)}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.acts select{width:auto;max-width:150px;padding:8px}
.ib{min-width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.ib:disabled{opacity:.35;cursor:default}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.sp{flex:1}
.b,.g{border-radius:99px;padding:9px 20px;cursor:pointer;border:1px solid var(--acc2);background:var(--acc2);color:#fbf7ef}
.g{background:none;color:var(--acc2);border-color:var(--line)}.g:hover{border-color:var(--acc)}.d{color:#9a4b3d}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:5px 14px;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fbf7ef}
input,select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
.bar input{width:200px}
.grid,.og{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px}
.card{position:relative;cursor:pointer}
.card b{display:block;font-weight:400;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card small{color:var(--mut)}
.ph{aspect-ratio:4/5;background:#fffdf8;border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;overflow:hidden;transition:border-color .2s}
.card:hover .ph{border-color:var(--acc)}
.ph img{max-width:92%;max-height:92%;object-fit:contain}
.hb{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(251,247,239,.9);color:#cbbba6;font-size:17px;cursor:pointer}
.hb.on{color:#b2584a}
.empty{padding:70px 20px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:16px}
.mut{color:var(--mut)}
.studio{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.cv{position:relative;aspect-ratio:4/5;max-height:78vh;margin:0 auto;background:#fffdf8;border:1px solid var(--line);border-radius:16px;overflow:hidden;touch-action:none;user-select:none}
.cv .hint{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);text-align:center;padding:30px;pointer-events:none}
.pi{position:absolute;cursor:grab}.pi img{width:100%;display:block;pointer-events:none}
.pi.on{outline:1px dashed var(--acc)}
.rz{display:none;position:absolute;right:-8px;bottom:-8px;width:18px;height:18px;border-radius:50%;background:var(--acc2);border:2px solid #fff;cursor:nwse-resize}
.pi.on .rz{display:block}
.tray{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;max-height:78vh;overflow:auto}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tg .ph{aspect-ratio:1;border-radius:10px;cursor:pointer}
.mo{position:fixed;inset:0;background:rgba(75,61,49,.4);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.md{position:relative;background:var(--bg);border-radius:18px;padding:28px;width:min(440px,100%);max-height:92vh;overflow:auto}
.md.w{width:min(820px,100%)}
.x{position:absolute;top:10px;right:14px;border:0;background:none;font-size:26px;cursor:pointer;color:var(--mut)}
.im{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:24px}
.f{display:flex;flex-direction:column;gap:12px}.f label{display:flex;flex-direction:column;gap:4px;color:var(--mut);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.mini{display:flex;flex-wrap:wrap;gap:10px}
.mini div{position:relative;width:76px;cursor:pointer}.mini .ph{aspect-ratio:1;border-radius:10px}
.mini i{position:absolute;top:2px;right:4px;font-size:11px;font-style:normal;color:var(--mut)}
.ck{display:flex;gap:8px;align-items:center;margin:6px 0}.ck input{width:auto}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;cursor:pointer}
.tile:hover{border-color:var(--acc)}.tile small{color:var(--mut)}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fbf7ef;padding:10px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
#toast.on{opacity:1}
.auth{max-width:360px;margin:12vh auto;padding:0 20px}.auth .f{margin-top:22px}
@media(max-width:860px){.studio{grid-template-columns:1fr}.tray{max-height:none}.im{grid-template-columns:1fr}.im .ph{max-width:240px}}
@media(min-width:1025px) and (max-width:1180px){.studio{grid-template-columns:1fr}.tray{max-height:none}}
@media(max-width:1024px){.app{grid-template-columns:1fr}
#sb{position:fixed;z-index:60;left:0;top:0;bottom:0;width:min(300px,86vw);height:auto;transform:translateX(-102%);transition:transform .25s}
#sb.open{transform:none;box-shadow:0 0 40px rgba(75,61,49,.25)}
#scrim.on{display:block;position:fixed;inset:0;background:rgba(75,61,49,.35);z-index:55}
.top{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:30}
.ham{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer}
main{padding:22px 18px 100px}}
@media(max-width:600px){
#bn{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:40}
#bn button{text-align:center;font-size:13px;padding:8px;flex:1}.sn{display:none}
.t1{display:flex}.t1,.t2{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-14px;padding-inline:14px}
.chip{padding:9px 16px}
.grid,.og{grid-template-columns:repeat(2,1fr);gap:12px}.bar input{width:100%}#toast{bottom:90px}
main{padding:16px 14px 110px}.md{padding:22px 16px}.mr{font-size:14px}.mr:not(.p){margin-left:8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
/* ── CONFIG: paste your Supabase project values to enable accounts + cloud storage. Leave empty for local demo mode. ── */
let SUPABASE_URL='', SUPABASE_ANON_KEY='', demo=false;
try{SUPABASE_URL=localStorage.wd_url||SUPABASE_URL;SUPABASE_ANON_KEY=localStorage.wd_key||SUPABASE_ANON_KEY}catch(e){}

const GROUPS={Tops:['T-shirts','Tank tops','Shirts','Long-sleeve tops'],Outerwear:['Cardigans','Jackets','Long-sleeve outerwear'],Bottoms:['Long pants','Shorts','Jeans','Skirts'],Other:['Shoes','Bags','Accessories']};
const DEFCOLS=['ท่องเที่ยว','อยู่บ้าน','มหาวิทยาลัย','ทำงาน'];
const DEFCATS=[['tops','เสื้อ',[['t-shirts','เสื้อยืด'],['tank-tops','เสื้อกล้าม'],['shirts','เสื้อเชิ้ต'],['long-sleeve-tops','เสื้อแขนยาว']]],['outerwear','เสื้อคลุม',[['cardigans','คาร์ดิแกน'],['jackets','แจ็กเก็ต'],['long-sleeve-outerwear','เสื้อคลุมแขนยาว']]],['bottoms','ท่อนล่าง',[['long-pants','กางเกงขายาว'],['shorts','กางเกงขาสั้น'],['jeans','ยีนส์'],['skirts','กระโปรง']]],['other','อื่นๆ',[['shoes','รองเท้า'],['bags','กระเป๋า'],['accessories','เครื่องประดับ']]]];
const uuid=()=>crypto.randomUUID(), $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)};

/* ── Local demo data layer (IndexedDB) ── */
const idb=(()=>{let db;const open=()=>db||(db=new Promise((res,rej)=>{const r=indexedDB.open('wardrobe',1);r.onupgradeneeded=()=>['items','outfits','cols','cats'].forEach(s=>r.result.createObjectStore(s,{keyPath:'id'}));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const tx=async(s,m,f)=>{const d=await open();return new Promise((res,rej)=>{const t=d.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
return{all:s=>tx(s,'readonly',st=>st.getAll()),put:(s,o)=>tx(s,'readwrite',st=>st.put(o)),del:(s,id)=>tx(s,'readwrite',st=>st.delete(id))}})();
const newest=(a,b)=>b.created-a.created;
const Local={
 async init(){if(!(await idb.all('cols')).length)for(const name of DEFCOLS)await idb.put('cols',{id:uuid(),name,outfitIds:[]});
 let done;try{done=localStorage.wd_cats}catch(e){}if(!done){await this.seed();try{localStorage.wd_cats=1}catch(e){}}return{email:'โหมดทดลอง · บันทึกในเบราว์เซอร์นี้'}},
 async seed(){const old=await idb.all('cats'),slugs={};let o=1;
  for(const[ps,pn,ss]of DEFCATS){const p={id:uuid(),name:pn,slug:ps,parent_id:null,sort_order:o++};await idb.put('cats',p);let k=1;for(const[sg,sn]of ss){const c={id:uuid(),name:sn,slug:sg,parent_id:p.id,sort_order:k++};await idb.put('cats',c);slugs[sg]=c.id}}
  for(const c of old)await idb.put('cats',{...c,parent_id:null,sort_order:100+o++});
  for(const it of await idb.all('items'))if(!it.category_id&&it.category){const id=slugs[it.category.toLowerCase().replace(/ /g,'-')]||(old.find(c=>c.name===it.category)||{}).id;await idb.put('items',{...it,category_id:id||null})}},
 async cats(){return(await idb.all('cats')).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))},
 async addCat(name,parent_id,sort_order){const c={id:uuid(),name,parent_id:parent_id||null,sort_order};await idb.put('cats',c);return c},
 async updCat(id,patch){const c=(await idb.all('cats')).find(c=>c.id===id);await idb.put('cats',{...c,...patch})},
 async setOrder(l){for(const[id,sort_order]of l)await this.updCat(id,{sort_order})},
 async delCat(ids,target){for(const it of await idb.all('items'))if(ids.includes(it.category_id))await idb.put('items',{...it,category_id:target||null});for(const id of ids)await idb.del('cats',id)},
 async items(){return(await idb.all('items')).sort(newest).map(i=>({...i,url:URL.createObjectURL(i.blob)}))},
 addItem:(blob,name,category)=>idb.put('items',{id:uuid(),name,category_id:category||null,blob,created:Date.now()}),
 async updItem(id,patch,blob){const o=(await idb.all('items')).find(i=>i.id===id);await idb.put('items',{...o,...patch,...(blob?{blob}:{})})},
 delItem:it=>idb.del('items',it.id),
 async outfits(){return(await idb.all('outfits')).sort(newest).map(o=>({...o,url:URL.createObjectURL(o.blob)}))},
 async saveOutfit({name,blob,layout,itemIds,cols,fav}){const sig=itemIds.slice().sort().join();if((await idb.all('outfits')).some(o=>o.sig===sig))return{dup:true};
  const id=uuid();await idb.put('outfits',{id,name,blob,layout,itemIds,sig,fav,created:Date.now()});
  for(const c of(await idb.all('cols')).filter(c=>cols.includes(c.id)))await idb.put('cols',{...c,outfitIds:[...c.outfitIds,id]});return{}},
 async delOutfit(o){await idb.del('outfits',o.id);for(const c of await idb.all('cols'))if(c.outfitIds.includes(o.id))await idb.put('cols',{...c,outfitIds:c.outfitIds.filter(x=>x!==o.id)})},
 async setFav(id,v){const o=(await idb.all('outfits')).find(o=>o.id===id);await idb.put('outfits',{...o,fav:v})},
 cols:()=>idb.all('cols'),addCol:name=>idb.put('cols',{id:uuid(),name,outfitIds:[]}),delCol:id=>idb.del('cols',id),
 async setCol(oid,cid,on){const c=(await idb.all('cols')).find(c=>c.id===cid);const s=new Set(c.outfitIds);on?s.add(oid):s.delete(oid);await idb.put('cols',{...c,outfitIds:[...s]})}
};

/* ── Supabase data layer (auth, storage, RLS-protected tables) ── */
const SB={
 async init(){this.c=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const{data}=await this.c.auth.getSession();if(!data.session)return null;this.uid=data.session.user.id;
  const{count}=await this.c.from('collections').select('*',{count:'exact',head:true});if(!count)await this.c.from('collections').insert(DEFCOLS.map(name=>({name,user_id:this.uid})));const cc=await this.c.from('categories').select('*',{count:'exact',head:true});if(!cc.count)await this.c.rpc('seed_default_categories',{uid:this.uid});return{email:data.session.user.email}},
 async signIn(email,password){const{error}=await this.c.auth.signInWithPassword({email,password});if(error)throw error},
 async signUp(email,password){const{data,error}=await this.c.auth.signUp({email,password});if(error)throw error;return!!data.session},
 signOut:()=>SB.c.auth.signOut(),
 async sign(paths){const m={};if(!paths.length)return m;const{data}=await this.c.storage.from('wardrobe').createSignedUrls(paths,3600);(data||[]).forEach(d=>m[d.path]=d.signedUrl);return m},
 async up(blob,kind){const p=`${this.uid}/${kind}/${uuid()}.${blob.type==='image/png'?'png':'jpg'}`;const{error}=await this.c.storage.from('wardrobe').upload(p,blob,{contentType:blob.type});if(error)throw error;return p},
 async cats(){return(await this.c.from('categories').select('*').order('sort_order')).data||[]},
 async addCat(name,parent_id,sort_order){const{data,error}=await this.c.from('categories').insert({user_id:this.uid,name,parent_id:parent_id||null,sort_order}).select().single();if(error)throw error;return data},
 async updCat(id,patch){const{error}=await this.c.from('categories').update(patch).eq('id',id);if(error)throw error},
 async setOrder(l){await Promise.all(l.map(([id,sort_order])=>this.c.from('categories').update({sort_order}).eq('id',id)))},
 async delCat(ids,target){const a=await this.c.from('items').update({category_id:target||null}).in('category_id',ids);if(a.error)throw a.error;const{error}=await this.c.from('categories').delete().in('id',ids);if(error)throw error},
 async items(){const{data}=await this.c.from('items').select('*').order('created_at',{ascending:false});const m=await this.sign(data.map(i=>i.image_path));return data.map(i=>({id:i.id,name:i.name,category_id:i.category_id,path:i.image_path,url:m[i.image_path]}))},
 async addItem(blob,name,category){const image_path=await this.up(blob,'items');const{error}=await this.c.from('items').insert({user_id:this.uid,name,category_id:category||null,image_path});if(error)throw error},
 async updItem(id,patch,blob,old){const u={...patch};if(blob){u.image_path=await this.up(blob,'items');await this.c.storage.from('wardrobe').remove([old.path])}await this.c.from('items').update(u).eq('id',id)},
 async delItem(it){await this.c.storage.from('wardrobe').remove([it.path]);await this.c.from('items').delete().eq('id',it.id)},
 async outfits(){const{data}=await this.c.from('outfits').select('*, outfit_items(item_id)').order('created_at',{ascending:false});const m=await this.sign(data.map(o=>o.image_path));
  return data.map(o=>({id:o.id,name:o.name,path:o.image_path,url:m[o.image_path],layout:o.layout,fav:o.is_favorite,itemIds:o.outfit_items.map(x=>x.item_id)}))},
 async saveOutfit({name,blob,layout,itemIds,cols,fav}){const signature=itemIds.slice().sort().join();
  const{data:ex}=await this.c.from('outfits').select('id').eq('signature',signature);if(ex&&ex.length)return{dup:true};
  const image_path=await this.up(blob,'outfits');const{data,error}=await this.c.from('outfits').insert({user_id:this.uid,name,image_path,layout,signature,is_favorite:fav}).select().single();
  if(error){await this.c.storage.from('wardrobe').remove([image_path]);if(error.code==='23505')return{dup:true};throw error}
  await this.c.from('outfit_items').insert(itemIds.map(item_id=>({outfit_id:data.id,item_id,user_id:this.uid})));
  if(cols.length)await this.c.from('collection_outfits').insert(cols.map(collection_id=>({collection_id,outfit_id:data.id,user_id:this.uid})));return{}},
 async delOutfit(o){await this.c.storage.from('wardrobe').remove([o.path]);await this.c.from('outfits').delete().eq('id',o.id)},
 setFav:(id,v)=>SB.c.from('outfits').update({is_favorite:v}).eq('id',id),
 async cols(){const{data}=await this.c.from('collections').select('*, collection_outfits(outfit_id)').order('created_at');return data.map(c=>({id:c.id,name:c.name,outfitIds:c.collection_outfits.map(x=>x.outfit_id)}))},
 addCol:name=>SB.c.from('collections').insert({name,user_id:SB.uid}),delCol:id=>SB.c.from('collections').delete().eq('id',id),
 async setCol(outfit_id,collection_id,on){on?await this.c.from('collection_outfits').insert({collection_id,outfit_id,user_id:this.uid}):await this.c.from('collection_outfits').delete().match({collection_id,outfit_id})}
};

/* ── App state & helpers ── */
let api,user,S={items:[],outfits:[],cols:[],cats:[],view:'wardrobe',cat:'all',exp:new Set(),q:'',tf:'All',pieces:[],sel:null,rep:false,colView:null};
const item=id=>S.items.find(i=>i.id===id), outfit=id=>S.outfits.find(o=>o.id===id);
const UNC='ยังไม่ได้จัดหมวดหมู่',bySort=(a,b)=>(a.sort_order||0)-(b.sort_order||0);
const cat=id=>S.cats.find(c=>c.id===id);
const parents=()=>S.cats.filter(c=>!c.parent_id).sort(bySort);
const subs=pid=>S.cats.filter(c=>c.parent_id===pid).sort(bySort);
const kids=id=>[id,...subs(id).map(c=>c.id)];
const count=ids=>S.items.filter(i=>ids.includes(i.category_id)).length;
const parentOf=it=>{const c=cat(it.category_id);return c&&(c.parent_id?cat(c.parent_id):c)};

/* ── Image processing: downscale + optional background removal ── */
async function proc(file,rm){const im=await createImageBitmap(file),k=Math.min(1,1600/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k);
 const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(im,0,0,w,h);
 if(rm)clearBg(g,w,h);const png=rm||file.type==='image/png';return new Promise(r=>c.toBlob(r,png?'image/png':'image/jpeg',.92))}
function clearBg(g,w,h){const d=g.getImageData(0,0,w,h),p=d.data,cs=[[0,0],[w-1,0],[0,h-1],[w-1,h-1]].map(([x,y])=>{const i=(y*w+x)*4;return[p[i],p[i+1],p[i+2]]}),bg=[0,1,2].map(k=>cs.reduce((a,c)=>a+c[k],0)/4);
 const near=i=>Math.hypot(p[i]-bg[0],p[i+1]-bg[1],p[i+2]-bg[2])<42,seen=new Uint8Array(w*h),st=[];
 for(let x=0;x<w;x++)st.push(x,(h-1)*w+x);for(let y=0;y<h;y++)st.push(y*w,y*w+w-1);
 while(st.length){const n=st.pop();if(seen[n]||!near(n*4))continue;seen[n]=1;p[n*4+3]=0;const x=n%w;if(x>0)st.push(n-1);if(x<w-1)st.push(n+1);if(n>=w)st.push(n-w);if(n<w*(h-1))st.push(n+w)}
 g.putImageData(d,0,0)}

 drawPieces()}
function drawPieces(){$('#cv').innerHTML=S.pieces.map((p,i)=>{const it=item(p.itemId);return it?`<div class="pi ${p.id===S.sel?'on':''}" data-id="${p.id}" style="left:${p.x*100}%;top:${p.y*100}%;width:${p.w*100}%;z-index:${i+1}"><img src="${it.url}" alt="${esc(it.name)}" draggable="false"><i class="rz"></i></div>`:''}).join('')+(S.pieces.length?'':'<div class="hint">เลือกเสื้อผ้าจากรายการเพื่อวางที่นี่<br>ลากเพื่อเคลื่อนย้าย ดึงจุดมุมเพื่อปรับขนาด</div>')}
function addPiece(id){const it=item(id);if(S.rep&&S.sel){const p=S.pieces.find(x=>x.id===S.sel);p.itemId=id;p.ar=it.ar;S.rep=false;drawPieces();return toast('เปลี่ยนชิ้นแล้ว')}
 const[x,y,w]={tops:[.28,.04,.44],outerwear:[.5,.1,.42],bottoms:[.3,.42,.4],other:[.62,.74,.26]}[(parentOf(it)||{}).slug]||[.35,.35,.3];
 const p={id:uuid(),itemId:id,x,y,w,ar:it.ar};S.pieces.push(p);S.sel=p.id;drawPieces()}
function mv(d){const i=S.pieces.findIndex(p=>p.id===S.sel),j=i+d;if(i<0)return toast('เลือกชิ้นเสื้อผ้าก่อน');if(j<0||j>=S.pieces.length)return;[S.pieces[i],S.pieces[j]]=[S.pieces[j],S.pieces[i]];drawPieces()}
function rep(){if(!S.sel)return toast('เลือกชิ้นบนผืนผ้าใบก่อน');S.rep=true;toast('แตะชิ้นใหม่ที่ต้องการจากรายการ')}
function rmPiece(){if(!S.sel)return toast('เลือกชิ้นเสื้อผ้าก่อน');S.pieces=S.pieces.filter(p=>p.id!==S.sel);S.sel=null;drawPieces()}
async function exportPNG(){const W=1000,H=1250,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.fillStyle='#fffdf8';g.fillRect(0,0,W,H);
 for(const p of S.pieces){const it=item(p.itemId);if(it)g.drawImage(await loadImg(it.url),p.x*W,p.y*H,p.w*W,p.w*W*p.ar)}return new Promise(r=>c.toBlob(r,'image/png'))}
async function dl(){if(!S.pieces.length)return toast('เพิ่มเสื้อผ้าก่อน');try{const a=document.createElement('a');a.href=URL.createObjectURL(await exportPNG());a.download='outfit.png';a.click()}catch(e){toast('ส่งออกรูปไม่สำเร็จ')}}
function saveDlg(){const ids=new Set(S.pieces.map(p=>p.itemId));if(ids.size<2)return toast('เพิ่มเสื้อผ้าอย่างน้อย 2 ชิ้นที่ต่างกันเพื่อบันทึกชุด');
 modal(`<h2>บันทึกชุด</h2><div class="f" style="margin-top:16px"><label>ชื่อ<input id="on" value="ชุดที่ ${S.outfits.length+1}"></label><div>${S.cols.map(c=>`<label class="ck"><input type="checkbox" name="sc" value="${c.id}">${esc(c.name)}</label>`).join('')}<label class="ck"><input type="checkbox" id="sf">เพิ่มในรายการโปรด</label></div><button class="b" id="sb" onclick="doSave()">บันทึกชุด</button></div>`)}
async function doSave(){const b=$('#sb');b.disabled=true;b.textContent='กำลังบันทึก…';try{const itemIds=[...new Set(S.pieces.map(p=>p.itemId))],r=await api.saveOutfit({name:$('#on').value.trim()||'ชุด',blob:await exportPNG(),layout:S.pieces.map(({itemId,x,y,w,ar})=>({itemId,x,y,w,ar})),itemIds,cols:[...document.getElementsByName('sc')].filter(x=>x.checked).map(x=>x.value),fav:$('#sf').checked});
 closeM();if(r.dup)return toast('ชุดนี้ถูกบันทึกไว้แล้ว');await load();toast('บันทึกชุดและเพิ่มในประวัติการแมตช์แล้ว')}catch(e){b.disabled=false;b.textContent='บันทึกชุด';toast('บันทึกไม่สำเร็จ: '+e.message)}}

/* ── Outfits, collections, favorites ── */
async function fav(id){const o=outfit(id);o.fav=!o.fav;await api.setFav(id,o.fav);render()}
function openOutfit(id){const o=outfit(id);
 modal(`<div class="im"><div class="ph"><img src="${o.url}" alt=""></div><div class="f"><h2>${esc(o.name)}</h2><div class="mini">${o.itemIds.filter(item).map(x=>`<div onclick="openItem('${x}')" title="${esc(item(x).name)}"><div class="ph"><img src="${item(x).url}" alt=""></div></div>`).join('')}</div>
 <div><h4>คอลเลกชัน</h4>${S.cols.map(c=>`<label class="ck"><input type="checkbox" ${c.outfitIds.includes(id)?'checked':''} onchange="setCol('${id}','${c.id}',this.checked)">${esc(c.name)}</label>`).join('')}</div>
 <div class="row"><button class="g" onclick="fav('${id}');openOutfit('${id}')">${o.fav?'นำออกจากรายการโปรด':'เพิ่มในรายการโปรด'}</button><button class="g" onclick="toStudio('${id}')">เปิดในหน้าจัดชุด</button><button class="g" onclick="dlO('${id}')">ดาวน์โหลด</button><button class="g d" onclick="delO('${id}')">ลบ</button></div></div></div>`,true)}
async function setCol(oid,cid,on){await api.setCol(oid,cid,on);const c=S.cols.find(c=>c.id===cid),s=new Set(c.outfitIds);on?s.add(oid):s.delete(oid);c.outfitIds=[...s];if(S.view==='collections')render()}
function toStudio(id){const o=outfit(id);S.pieces=(o.layout||[]).filter(l=>item(l.itemId)).map(l=>({...l,id:uuid()}));S.sel=null;closeM();go('studio')}
function dlO(id){const a=document.createElement('a');a.href=outfit(id).url;a.download=outfit(id).name+'.png';a.target='_blank';a.click()}
async function delO(id){if(!confirm('ลบชุดนี้และประวัติการแมตช์ของชุดนี้?'))return;await api.delOutfit(outfit(id));closeM();await load();toast('ลบชุดแล้ว')}
function vFavorites(){const l=S.outfits.filter(o=>o.fav);$('#main').innerHTML=`<div class="bar"><h2>รายการโปรด</h2></div>${l.length?`<div class="og">${l.map(oCard).join('')}</div>`:'<div class="empty">ยังไม่มีรายการโปรด แตะหัวใจที่ชุดใดก็ได้</div>'}`}
function vCollections(){const v=S.colView;
 if(v){const c=S.cols.find(c=>c.id===v),l=v==='all'?S.outfits:S.outfits.filter(o=>c.outfitIds.includes(o.id));
  return $('#main').innerHTML=`<div class="bar"><button class="g" onclick="S.colView=null;render()">กลับ</button><h2>${v==='all'?'ชุดทั้งหมด':esc(c.name)}</h2><div class="sp"></div>${v!=='all'?`<button class="g d" onclick="delCol('${v}')">ลบคอลเลกชัน</button>`:''}</div>${l.length?`<div class="og">${l.map(oCard).join('')}</div>`:'<div class="empty">ยังไม่มีชุดที่นี่ เพิ่มได้จากหน้ารายละเอียดของชุด</div>'}`}
 $('#main').innerHTML=`<div class="bar"><h2>คอลเลกชันของฉัน</h2><div class="sp"></div><button class="b" onclick="newCol()">สร้างคอลเลกชันใหม่</button></div><div class="grid">
 <div class="tile" onclick="S.colView='all';render()"><h3 style="margin:0">ชุดทั้งหมด</h3><small>บันทึกแล้ว ${S.outfits.length} ชุด</small></div>
 ${S.cols.map(c=>`<div class="tile" onclick="S.colView='${c.id}';render()"><h3 style="margin:0">${esc(c.name)}</h3><small>${c.outfitIds.length} ชุด</small></div>`).join('')}
 <div class="tile" onclick="go('favorites')"><h3 style="margin:0">รายการโปรด</h3><small>${S.outfits.filter(o=>o.fav).length} ชุด</small></div></div>`}
async function newCol(){const n=(prompt('ชื่อคอลเลกชัน')||'').trim();if(n){await api.addCol(n);await load();toast('สร้างคอลเลกชันแล้ว')}}
async function delCol(id){if(!confirm('ลบคอลเลกชันนี้? ชุดต่างๆ จะยังอยู่ในตู้เสื้อผ้า'))return;await api.delCol(id);S.colView=null;await load()}

/* ── Category management ── */
const sibs=pid=>S.cats.filter(c=>(c.parent_id||null)===(pid||null)),nextSort=pid=>Math.max(0,...sibs(pid).map(c=>c.sort_order||0))+1;
async function run(f){try{await f();render();drawMC()}catch(e){toast('ทำรายการไม่สำเร็จ: '+e.message)}}
function manageCats(){closeSb();modal(`<h2>จัดการหมวดหมู่</h2><p class="mut" style="margin:6px 0 12px">เพิ่ม แก้ชื่อ จัดลำดับ หรือย้ายหมวดย่อยไปหมวดหลักอื่น การลบหมวดหมู่จะไม่ลบเสื้อผ้า</p><div id="mc"></div><button class="b" style="margin-top:16px" onclick="addCatUI(null)">+ เพิ่มหมวดหมู่หลัก</button>`,true);drawMC()}
function drawMC(){const el=$('#mc');if(!el)return;const ps=parents(),ib=(t,f,a,d)=>`<button class="ib" title="${a}" aria-label="${a}" ${d?'disabled':''} onclick="${f}">${t}</button>`,
 acts=(c,i,n)=>ib('↑',`reord('${c.id}',-1)`,'เลื่อนขึ้น',i===0)+ib('↓',`reord('${c.id}',1)`,'เลื่อนลง',i===n-1)+ib('✎',`renCat('${c.id}')`,'แก้ชื่อ');
 el.innerHTML=ps.map((p,i)=>`<div class="mr p"><b>${esc(p.name)}</b><small>${count(kids(p.id))} ชิ้น</small><span class="acts">${acts(p,i,ps.length)}${ib('＋',`addCatUI('${p.id}')`,'เพิ่มหมวดย่อย')}${ib('✕',`delCatDlg('${p.id}')`,'ลบ')}</span></div>`+subs(p.id).map((c,j,a)=>`<div class="mr"><span class="nm">${esc(c.name)}</span><small>${count([c.id])} ชิ้น</small><span class="acts">${acts(c,j,a.length)}<select aria-label="ย้ายไปหมวดหลัก" onchange="moveCat('${c.id}',this.value)">${ps.map(q=>`<option value="${q.id}" ${q.id===p.id?'selected':''}>${esc(q.name)}</option>`).join('')}</select>${ib('✕',`delCatDlg('${c.id}')`,'ลบ')}</span></div>`).join('')).join('')||'<p class="mut">ยังไม่มีหมวดหมู่</p>'}
async function addCatUI(pid){const n=(prompt(pid?'ชื่อหมวดย่อยใหม่':'ชื่อหมวดหมู่หลักใหม่')||'').trim();if(!n)return;if(sibs(pid).some(c=>c.name===n))return toast('มีชื่อนี้อยู่แล้ว');
 await run(async()=>{S.cats.push(await api.addCat(n,pid,nextSort(pid)));if(pid)S.exp.add(pid)})}
async function renCat(id){const c=cat(id),n=(prompt('ชื่อใหม่',c.name)||'').trim();if(!n||n===c.name)return;await run(async()=>{await api.updCat(id,{name:n});c.name=n})}
async function moveCat(id,pid){const c=cat(id),o=nextSort(pid);await run(async()=>{await api.updCat(id,{parent_id:pid,sort_order:o});c.parent_id=pid;c.sort_order=o;S.exp.add(pid)})}
async function reord(id,d){const c=cat(id),a=sibs(c.parent_id).sort(bySort),i=a.indexOf(c),j=i+d;if(j<0||j>=a.length)return;a.splice(j,0,a.splice(i,1)[0]);
 await run(async()=>{const l=a.map((x,k)=>[x.id,k+1]);await api.setOrder(l);l.forEach(([x,o])=>cat(x).sort_order=o)})}
function delCatDlg(id){const c=cat(id),ids=kids(id),n=count(ids),ns=c.parent_id?0:subs(id).length,
 opts=`<option value="">${UNC}</option>`+parents().filter(p=>!ids.includes(p.id)).map(p=>`<optgroup label="${esc(p.name)}"><option value="${p.id}">${esc(p.name)} (ทั่วไป)</option>${subs(p.id).filter(x=>!ids.includes(x.id)).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</optgroup>`).join('');
 modal(`<h2>ลบ “${esc(c.name)}”</h2><p>${ns?`หมวดย่อยทั้ง ${ns} หมวดจะถูกลบไปด้วย `:''}${n?`มีเสื้อผ้า ${n} ชิ้นในหมวดนี้ เสื้อผ้า รูปภาพ และประวัติการแมตช์จะไม่ถูกลบ เลือกหมวดที่จะย้ายไป`:'หมวดนี้ไม่มีเสื้อผ้า'}</p>${n?`<select id="dt">${opts}</select>`:''}<div class="row" style="margin-top:18px"><button class="b" onclick="doDelCat('${id}')">ลบหมวดหมู่</button><button class="g" onclick="manageCats()">ยกเลิก</button></div>`)}
async function doDelCat(id){const ids=kids(id),t=($('#dt')||{}).value||null;
 try{await api.delCat(ids,t);S.items.forEach(i=>{if(ids.includes(i.category_id))i.category_id=t});S.cats=S.cats.filter(c=>!ids.includes(c.id));if(ids.includes(S.cat))S.cat='all';render();manageCats();toast('ลบหมวดหมู่แล้ว เสื้อผ้าถูกย้ายเรียบร้อย')}catch(e){toast('ลบไม่สำเร็จ: '+e.message)}}

boot();
</script>
</body>
</html>
